name: build-fagor-spider
on:
  workflow_dispatch:
  push:
    paths:
      - 'spider/**'
      - '.github/workflows/build-fagor-spider.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build
        run: |
          chmod +x spider/build.sh
          spider/build.sh
      - name: Commit built JAR for stable subscription URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spider/fagor-spider.jar
          git commit -m "Build Fagor Spider JAR" || echo "No JAR changes"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: fagor-spider
          path: spider/fagor-spider.jar
